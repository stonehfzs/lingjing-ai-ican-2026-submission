<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>灵镜AI · 创作工作台</title><link rel="icon" href="/branding/lingjing.ico"><link rel="stylesheet" href="/graph.css"><link rel="stylesheet" href="/creator.css"><link rel="stylesheet" href="/direction.css"><link rel="stylesheet" href="/production.css"><link rel="stylesheet" href="/studio-v6.css"><link rel="stylesheet" href="/studio-v7.css"><link rel="stylesheet" href="/voice-lab.css"></head>
<body data-view="boards">
<header class="topbar"><a href="/" class="brand" aria-label="灵镜AI"><img class="app-brand-icon" src="/branding/lingjing-symbol.svg" alt="">灵镜AI</a><span class="divider"></span><button id="workspaceBtn" class="project-switch"><span id="workspaceName">打开项目</span><span>⌄</span></button><nav class="view-tabs" aria-label="创作视图"><button data-view="script">剧本</button><button data-view="boards" class="active">分镜</button><button data-view="resources">资源</button><button data-view="nodes">节点</button></nav><div class="top-actions"><span id="connection" class="connection"><i></i>连接中</span><span id="saveState" class="save-state">正在打开…</span><button id="saveBtn" class="primary">保存 <kbd>Ctrl S</kbd></button></div></header>
<main class="workspace"><aside class="library"><div class="panel-heading"><span id="libraryTitle">项目镜头</span><span id="resourceCount">—</span></div><div class="library-tabs"><button data-tab="scenes" class="active">场次</button><button data-tab="assets">资产</button><button data-tab="nodes">节点</button></div><div id="scenesPane" class="pane"><div class="project-overview"><span id="projectSubtitle">制作项目</span><div><strong id="totalShots">0</strong> 镜 <span>／</span> <strong id="totalScenes">0</strong> 场</div></div><button id="allScenes" class="all-scenes"><span>全部镜头</span><span id="allNodeCount">—</span></button><div id="sceneList" class="scene-list"></div><button id="addShotBtn" class="sidebar-action">＋ 新建镜头</button></div><div id="assetsPane" class="pane" hidden><div class="asset-tools"><input id="assetSearch" placeholder="搜索资源" aria-label="搜索资产"><select id="assetFilter" aria-label="资产类型"><option value="">所有资源</option><option value="character">人物</option><option value="scene">场景</option><option value="prop">道具</option><option value="audio">音频</option><option value="video">视频</option><option value="text">文字</option></select><button id="importAssetBtn" class="secondary">导入资源</button></div><div id="assetList" class="asset-list"></div></div><div id="nodesPane" class="pane" hidden><div class="node-catalog" id="nodeCatalog"></div><p class="panel-note">拖动输出端口连接资源。图片、声音与文字各有明确用途。</p></div></aside>
<section class="work-area"><div id="creativeToolbar" class="creative-toolbar"><div><span id="viewContext" class="context-line">当前项目</span><h1 id="viewTitle">分镜</h1></div><div class="creative-actions"><button id="reviewModeBtn" class="secondary">专注审阅</button><button id="viewActionBtn" class="primary">新建镜头</button></div></div><div id="scriptView" class="creative-view script-view" hidden></div><div id="boardsView" class="creative-view boards-view"></div><div id="resourcesView" class="creative-view resources-view" hidden></div>
<div id="graphView" class="graph-view" hidden><div class="canvas-toolbar"><div class="canvas-title"><h1 id="scopeTitle">节点工作流</h1></div><div class="scope-controls"><select id="shotFilter" aria-label="镜头过滤"><option value="">全部镜头</option></select><button id="layoutBtn" class="secondary">排版</button><button id="fitBtn" class="icon-button" title="适应画布" aria-label="适应画布">⤢</button><button id="toggleQueueBtn" class="secondary">任务</button></div></div><div id="conflictBar" class="conflict-bar" hidden>项目已有新版本。<button id="exportBtn">导出草稿</button><button id="reloadBtn">载入新版本</button></div><div class="canvas-meta"><span id="scopeStats">打开画布…</span><div>资源连接会参与实际任务编译</div></div><div id="viewport" class="viewport" tabindex="0" aria-label="节点画布，拖动空白平移，滚轮缩放"><div id="world" class="world"><svg id="edges" class="edges" width="20000" height="20000"><g id="edgePaths"></g><path id="draftEdge" class="draft-edge" hidden></path></svg><div id="nodeLayer"></div></div><div id="canvasEmpty" class="canvas-empty" hidden>当前范围没有节点<br><button id="emptyAdd" class="secondary">添加节点</button></div><div class="canvas-floating"><span id="selectedHint">点击节点打开设置</span><button id="deleteEdgeBtn" hidden>删除连接</button></div><div class="zoom"><button id="zoomOut" aria-label="缩小">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大">＋</button></div></div><div class="canvas-status"><span>拖动端口连接 · 空白平移 · 滚轮缩放</span><span id="graphRevision">—</span></div><section class="queue" hidden><div class="queue-heading"><div class="queue-tabs"><button id="pendingTab" class="active">待制作 <span id="pendingCount">—</span></button><button id="resultsTab">运行结果 <span id="resultsCount">0</span></button><button id="compiledTab">预演 <span id="compiledCount">0</span></button></div><button id="validateBtn" class="quiet">检查依赖</button><button id="compileBtn" class="primary small">预演当前范围</button></div><div id="queueBody" class="queue-body"></div></section></div></section>
<aside class="inspector" aria-label="设置卡片"><div class="panel-heading"><span>设置</span><span id="inspectorType">—</span><button id="closeInspector" class="icon-button" aria-label="关闭设置">×</button></div><div id="inspectorBody" class="inspector-body"></div><div class="inspector-foot">预演不会提交生成</div></aside></main>
<section id="reviewStage" class="review-stage" hidden aria-label="专注审阅"></section><div id="toast" class="toast" role="status" hidden></div>
<dialog id="workspaceDialog" class="workspace-dialog"><div class="dialog-heading"><div><span class="context-line">灵镜AI</span><h2>你的项目</h2></div><button class="icon-button" data-close-dialog aria-label="关闭项目库">×</button></div><div id="workspaceList" class="workspace-list"></div><form id="workspaceForm"><h3>新建项目</h3><label>项目名称<input name="name" required placeholder="项目名称"></label><label>剧本<textarea name="script" rows="4" placeholder="粘贴剧本，可稍后继续完善"></textarea></label><details><summary>文件与保存位置</summary><label>或从剧本文件导入<input name="scriptPath" placeholder="本机 .md / .txt 完整路径"></label><label>工作区目录（可选）<input name="workspacePath" placeholder="留空由工作台创建独立目录"></label></details><div class="dialog-actions"><button type="submit" class="primary">创建项目</button></div></form></dialog>
<dialog id="importDialog"><div class="dialog-heading"><h2>导入资源</h2><button data-close-dialog class="icon-button" aria-label="关闭导入">×</button></div><div id="uploadDrop" class="upload-drop"><strong>将图片、音频或视频拖到这里</strong><p>资源保存在当前项目中</p><button id="pickFilesBtn" class="secondary">选择文件</button><input id="assetFiles" type="file" accept="image/*,audio/*,video/*,.txt,.md" multiple hidden></div><form id="importForm"><details><summary>从本机路径导入</summary><label>完整路径<input name="path" placeholder="本机文件完整路径"></label><label>名称<input name="name" placeholder="使用文件名"></label><div class="field-row"><label>类型<select name="kind"><option value="image">图片</option><option value="audio">音频</option><option value="video">视频</option><option value="text">文字</option></select></label><label>用途<select name="role"><option value="reference">画面参考</option><option value="identity">人物身份</option><option value="voice_identity">音色身份</option><option value="dialogue_performance">台词表演</option><option value="ambience">环境声</option><option value="music">音乐</option><option value="lip_sync_driver">口型驱动</option><option value="context">文字上下文</option></select></label></div><button type="submit" class="primary">导入路径</button></details><div id="uploadStatus" class="field-help" aria-live="polite"></div><button id="cancelImport" type="button" hidden>取消</button></form></dialog>
<dialog id="newShotDialog"><form id="newShotForm"><div class="dialog-heading"><h2>新建镜头</h2><button type="button" data-close-dialog class="icon-button">×</button></div><label>镜头名称<input name="title" required placeholder="镜头中发生了什么"></label><label>场次<select name="sceneId" id="newShotScene"></select></label><label>画面动作<textarea name="action" rows="4" placeholder="可见的动作与起止状态"></textarea></label><p id="newShotSource" class="field-help"></p><div class="dialog-actions"><button type="submit" class="primary">创建镜头</button></div></form></dialog>
<script src="/graph.js" defer></script><script src="/creator.js" defer></script><script src="/direction-ui.js" defer></script><script src="/edit-preview.js" defer></script><script src="/library.js" defer></script><script src="/pro-editor.js" defer></script><script src="/production.js" defer></script><script src="/service-status.js" defer></script><script src="/editor-tools.js"></script><script src="/voice-lab.js" defer></script></body></html>
